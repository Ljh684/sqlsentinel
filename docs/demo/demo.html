<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SQLSentinel final demo</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: "Segoe UI", Arial, sans-serif;
        background: #07111f;
        color: #e7f0ff;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        width: 100vw;
        height: 100vh;
        display: grid;
        place-items: center;
        overflow: hidden;
        background:
          radial-gradient(circle at 82% 18%, #153b6244 0, transparent 34%),
          radial-gradient(circle at 8% 92%, #0c766044 0, transparent 30%),
          linear-gradient(135deg, #07111f, #0c1a2d 60%, #07131e);
      }

      main {
        display: grid;
        grid-template-rows: auto 1fr auto;
        width: min(1280px, 100vw, calc(100vh * 16 / 9));
        height: min(720px, 100vh, calc(100vw * 9 / 16));
        overflow: hidden;
        border: 1px solid #18324b;
        border-radius: 18px;
        background: #07111f;
        box-shadow: 0 24px 70px #0008;
        padding: 52px 64px 38px;
      }

      header,
      footer {
        display: flex;
        align-items: center;
        justify-content: space-between;
        color: #88a4c2;
        font-size: 18px;
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }

      .brand {
        color: #56e6bd;
        font-weight: 700;
      }

      .content {
        align-self: center;
        min-width: 0;
      }

      h1 {
        margin: 0 0 20px;
        color: #ffffff;
        font-size: 58px;
        line-height: 1.05;
        letter-spacing: -0.035em;
      }

      h2 {
        margin: 0 0 24px;
        color: #ffffff;
        font-size: 45px;
        line-height: 1.1;
        letter-spacing: -0.025em;
      }

      p {
        max-width: 1040px;
        margin: 0;
        color: #b8cbe0;
        font-size: 27px;
        line-height: 1.45;
      }

      .accent {
        color: #56e6bd;
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 18px;
        margin-top: 30px;
      }

      .card {
        min-height: 128px;
        padding: 22px 24px;
        border: 1px solid #31506d;
        border-radius: 16px;
        background: #0d2033cc;
      }

      .card strong {
        display: block;
        margin-bottom: 10px;
        color: #56e6bd;
        font-size: 25px;
      }

      .card span {
        color: #bfd0e2;
        font-size: 20px;
        line-height: 1.35;
      }

      pre {
        margin: 26px 0 0;
        padding: 22px 26px;
        overflow: hidden;
        border: 1px solid #29445f;
        border-radius: 16px;
        background: #030912e8;
        color: #c7f9e7;
        font: 20px/1.5 Consolas, "Cascadia Mono", monospace;
        white-space: pre-wrap;
      }

      .metric-row {
        display: flex;
        gap: 20px;
        margin-top: 28px;
      }

      .metric {
        min-width: 190px;
        padding: 20px 24px;
        border-left: 4px solid #56e6bd;
        border-radius: 10px;
        background: #0c2033;
      }

      .metric b {
        display: block;
        color: #ffffff;
        font-size: 39px;
      }

      .metric span {
        color: #89a8c5;
        font-size: 17px;
        text-transform: uppercase;
      }

      .dots {
        display: flex;
        gap: 9px;
      }

      .dot {
        appearance: none;
        width: 9px;
        height: 9px;
        padding: 0;
        border: 0;
        border-radius: 999px;
        background: #29445f;
        cursor: pointer;
      }

      .dot.active {
        width: 28px;
        background: #56e6bd;
      }

      footer {
        display: grid;
        grid-template-columns: 1fr auto 1fr;
        gap: 24px;
      }

      .controls {
        display: flex;
        justify-self: end;
        gap: 8px;
      }

      .control {
        min-width: 42px;
        height: 34px;
        padding: 0 13px;
        border: 1px solid #31506d;
        border-radius: 9px;
        background: #0d2033;
        color: #d7e7f7;
        font: 600 14px/1 "Segoe UI", Arial, sans-serif;
        letter-spacing: 0.04em;
        cursor: pointer;
      }

      .control:hover {
        border-color: #56e6bd;
        color: #56e6bd;
      }

      .control:disabled {
        cursor: default;
        opacity: 0.35;
      }

      @media (max-width: 900px), (max-height: 560px) {
        main {
          padding: 28px 34px 24px;
          border-radius: 0;
        }

        h1 {
          font-size: 44px;
        }

        h2 {
          font-size: 34px;
        }

        p,
        pre {
          font-size: 18px;
        }

        .card strong {
          font-size: 20px;
        }

        .card span,
        .metric span {
          font-size: 15px;
        }

        .metric b {
          font-size: 28px;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <span class="brand">SQLSentinel</span>
        <span id="section"></span>
      </header>
      <section class="content" id="content"></section>
      <footer>
        <span>MoonBit Hackathon 2026 · Ljh684</span>
        <span class="dots" id="dots"></span>
        <div class="controls" aria-label="Slideshow controls">
          <button class="control" id="previous" aria-label="Previous slide">&larr;</button>
          <button class="control" id="autoplay" aria-label="Toggle autoplay">Auto</button>
          <button class="control" id="next" aria-label="Next slide">&rarr;</button>
        </div>
      </footer>
    </main>
    <script>
      const slides = [
        {
          section: "Final demo",
          content: `
            <h1>SQLSentinel</h1>
            <p>Deterministic database-change intelligence written in MoonBit.</p>
            <div class="metric-row">
              <div class="metric"><b>v0.16.0</b><span>Release</span></div>
              <div class="metric"><b>15 + 1</b><span>Risk rules</span></div>
              <div class="metric"><b>0</b><span>Runtime model calls</span></div>
            </div>`,
        },
        {
          section: "Problem",
          content: `
            <h2>Review database changes before deployment</h2>
            <p>Find dangerous SQL, simulate ordered schema evolution, and locate downstream queries without connecting to a database.</p>
            <div class="grid">
              <div class="card"><strong>Statements</strong><span>Unsafe DML and destructive DDL</span></div>
              <div class="card"><strong>Migrations</strong><span>Missing objects, types, renames, indexes</span></div>
              <div class="card"><strong>Impact</strong><span>Queries that depend on changed objects</span></div>
            </div>`,
        },
        {
          section: "Architecture",
          content: `
            <h2>A bounded semantic pipeline</h2>
            <pre>context lexer  →  top-level splitter  →  structural parser
schema reducer  →  coverage tracer  →  query impact  →  policy</pre>
            <p>Every statement receives a trace with its source span, grammar branch, analyzed/ignored status, and reason.</p>`,
        },
        {
          section: "Coverage",
          content: `
            <h2>Unsupported syntax stays visible</h2>
            <pre>Coverage: 0/2 statements analyzed, 2 ignored
  COMMENT ON TABLE ...  ignored, root outside grammar
  DROP CONSTRAINT ...   ignored, unsupported migration branch

--require-full-coverage → CI fails explicitly</pre>`,
        },
        {
          section: "Migration plan",
          content: `
            <h2>Ordered multi-file schema state</h2>
            <div class="metric-row">
              <div class="metric"><b>5/5</b><span>Statements traced</span></div>
              <div class="metric"><b>4</b><span>Schema changes</span></div>
              <div class="metric"><b>SQL301–304</b><span>Semantic findings</span></div>
            </div>
            <p>Tables, columns, indexes, foreign keys, types, and renames evolve in execution order.</p>`,
        },
        {
          section: "Dialect coverage",
          content: `
            <h2>PostgreSQL and MySQL grammar</h2>
            <pre>ALTER TABLE users MODIFY COLUMN email VARCHAR(320);
ALTER TABLE users CHANGE COLUMN email primary_email VARCHAR(320);</pre>
            <div class="metric-row">
              <div class="metric"><b>2/2</b><span>Analyzed</span></div>
              <div class="metric"><b>SQL301</b><span>Type change</span></div>
              <div class="metric"><b>SQL304</b><span>Rename risk</span></div>
            </div>`,
        },
        {
          section: "Impact and review",
          content: `
            <h2>One review, all evidence</h2>
            <div class="metric-row">
              <div class="metric"><b>2</b><span>Affected query files</span></div>
              <div class="metric"><b>BLOCK</b><span>Unified verdict</span></div>
              <div class="metric"><b>SARIF</b><span>Code Scanning</span></div>
            </div>
            <p>SQL301–SQL305 findings appear together with remediation actions and stable fingerprints.</p>`,
        },
        {
          section: "Acceptance",
          content: `
            <h2>Reproducible delivery</h2>
            <div class="metric-row">
              <div class="metric"><b>83</b><span>Native tests</span></div>
              <div class="metric"><b>79</b><span>Wasm-GC tests</span></div>
              <div class="metric"><b>PASS</b><span>Acceptance harness</span></div>
            </div>
            <pre>.\scripts\acceptance.ps1
moon add Ljh684/sqlsentinel@0.16.0</pre>`,
        },
        {
          section: "Links",
          content: `
            <h2>SQLSentinel v0.16.0</h2>
            <pre>github.com/Ljh684/sqlsentinel
mooncakes.io → Ljh684/sqlsentinel@0.16.0
docs → ACCEPTANCE · ANALYSIS_MODEL · DEMO</pre>
            <p class="accent">Deterministic evidence. Explicit boundaries. Reproducible review.</p>`,
        },
      ];

      const section = document.querySelector("#section");
      const content = document.querySelector("#content");
      const dots = document.querySelector("#dots");
      const previous = document.querySelector("#previous");
      const next = document.querySelector("#next");
      const autoplay = document.querySelector("#autoplay");
      let timer = null;

      function indexFromHash() {
        const requested = Number.parseInt(location.hash.slice(1), 10);
        return Number.isFinite(requested)
          ? Math.max(0, Math.min(slides.length - 1, requested - 1))
          : 0;
      }

      let index = indexFromHash();

      function updateHash() {
        try {
          history.replaceState(null, "", `#${index + 1}`);
        } catch {
          location.hash = String(index + 1);
        }
      }

      function render(nextIndex, syncHash = true) {
        index = Math.max(0, Math.min(slides.length - 1, nextIndex));
        const slide = slides[index];
        section.textContent = slide.section;
        content.innerHTML = slide.content;
        dots.innerHTML = slides
          .map(
            (_, i) =>
              `<button class="dot${i === index ? " active" : ""}" ` +
              `data-slide="${i}" aria-label="Go to slide ${i + 1}"></button>`,
          )
          .join("");
        dots.querySelectorAll(".dot").forEach((dot) => {
          dot.addEventListener("click", () => {
            stopAutoplay();
            render(Number(dot.dataset.slide));
          });
        });
        previous.disabled = index === 0;
        next.disabled = index === slides.length - 1;
        autoplay.textContent = timer ? "Pause" : "Auto";
        if (syncHash) updateHash();
      }

      function move(delta) {
        render(index + delta);
      }

      function stopAutoplay() {
        if (timer) {
          clearInterval(timer);
          timer = null;
        }
        autoplay.textContent = "Auto";
      }

      function toggleAutoplay() {
        if (timer) {
          stopAutoplay();
          return;
        }
        timer = setInterval(() => {
          if (index >= slides.length - 1) {
            stopAutoplay();
          } else {
            render(index + 1);
          }
        }, 6500);
        autoplay.textContent = "Pause";
      }

      previous.addEventListener("click", () => {
        stopAutoplay();
        move(-1);
      });
      next.addEventListener("click", () => {
        stopAutoplay();
        move(1);
      });
      autoplay.addEventListener("click", toggleAutoplay);
      window.addEventListener("hashchange", () => render(indexFromHash(), false));
      window.addEventListener("keydown", (event) => {
        if (event.key === "ArrowRight" || event.key === "PageDown") {
          event.preventDefault();
          stopAutoplay();
          move(1);
        } else if (event.key === "ArrowLeft" || event.key === "PageUp") {
          event.preventDefault();
          stopAutoplay();
          move(-1);
        } else if (event.key === "Home") {
          event.preventDefault();
          stopAutoplay();
          render(0);
        } else if (event.key === "End") {
          event.preventDefault();
          stopAutoplay();
          render(slides.length - 1);
        } else if (event.key === " ") {
          event.preventDefault();
          toggleAutoplay();
        }
      });

      render(index, false);
    </script>
  </body>
</html>

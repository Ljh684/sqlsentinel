name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pinned MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh \
            | bash -s -- '0.10.14+7d59c7ec9'
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Show toolchain
        run: |
          moon version --all
          moon update

      - name: Check formatting
        run: moon fmt --check

      - name: Type-check
        run: moon check --target native

      - name: Run tests
        run: moon test --target native

      - name: Verify browser playground
        run: |
          bash scripts/build-web.sh
          git diff --exit-code -- web/dist
          node scripts/browser-smoke.mjs

      - name: Review safe examples
        run: |
          moon run --target native cmd/main -- \
            --fail-on warning \
            examples/safe_query.sql \
            examples/safe_migration.sql \
            examples/inline_ignore.sql

      - name: Verify dangerous example is rejected
        shell: bash
        run: |
          if moon run --target native cmd/main -- \
            --fail-on error examples/dangerous_migration.sql; then
            echo "Expected SQLSentinel to reject the dangerous example"
            exit 1
          fi

      - name: Verify changed-file mode
        shell: bash
        run: |
          printf 'DELETE FROM users;\n' > examples/changed_generated.sql
          git add examples/changed_generated.sql
          if moon run --target native cmd/main -- --changed; then
            echo "Expected SQLSentinel to reject the changed dangerous SQL"
            exit 1
          fi
          git reset examples/changed_generated.sql
          rm examples/changed_generated.sql

      - name: Verify project configuration
        shell: bash
        run: |
          moon run --target native cmd/main -- \
            --config examples/sqlsentinel.example.json > /dev/null
          if moon run --target native cmd/main -- \
            --config examples/sqlsentinel.example.json \
            --fail-on error > /dev/null; then
            echo "Expected CLI threshold to override the config"
            exit 1
          fi

      - name: Verify schema-aware review
        shell: bash
        run: |
          moon run --target native cmd/main -- \
            --format json \
            --fail-on never \
            --schema examples/schema.json \
            examples/schema_risks.sql > schema-report.json
          python3 -c "import json; d=json.load(open('schema-report.json')); \
            ids=[f['rule_id'] for f in d['files'][0]['findings']]; \
            assert 'SQL201' in ids; \
            assert 'SQL202' in ids; \
            assert d['files'][0]['schema'] is True"

      - name: Verify suppression audit
        run: |
          moon run --target native cmd/main -- \
            --format json \
            --fail-on never \
            examples/inline_ignore.sql > suppression-report.json
          python3 -c "import json; d=json.load(open('suppression-report.json')); \
            assert d['summary']['suppressed'] == 1; \
            assert d['files'][0]['suppressions'][0]['rule_id'] == 'SQL003'; \
            assert d['files'][0]['suppressions'][0]['count'] == 1"

      - name: Verify composite action
        uses: ./
        with:
          paths: examples/dangerous_migration.sql
          fail-on: never
          dialect: postgres

      - name: Verify composite action schema input
        uses: ./
        with:
          paths: examples/schema_risks.sql
          schema: examples/schema.json
          fail-on: never
          format: json

      - name: Validate machine-readable reports
        run: |
          moon run --target native cmd/main -- \
            --format json \
            --fail-on never \
            examples > sqlsentinel-report.json
          moon run --target native cmd/main -- \
            --format sarif \
            --fail-on never \
            examples > sqlsentinel-report.sarif
          python3 -m json.tool sqlsentinel-report.json > /dev/null
          python3 -m json.tool sqlsentinel-report.sarif > /dev/null

      - name: Upload reports
        uses: actions/upload-artifact@v4
        with:
          name: sqlsentinel-reports
          path: |
            sqlsentinel-report.json
            sqlsentinel-report.sarif
            schema-report.json
            suppression-report.json
            web/dist/**

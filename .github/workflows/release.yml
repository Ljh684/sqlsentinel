name: Release

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/release.yml"
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag
        required: true
        default: "v0.16.0"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pinned MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh \
            | bash -s -- '0.10.14+7d59c7ec9'
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Resolve release tag
        id: release
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            tag="$GITHUB_REF_NAME"
          elif [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            tag="${{ inputs.tag }}"
          else
            tag="$(git describe --tags --abbrev=0)"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Resolved release tag: $tag"

      - name: Preserve release presentation assets
        shell: bash
        run: |
          cp docs/RELEASE_NOTES.md "$RUNNER_TEMP/SQLSENTINEL_RELEASE_NOTES.md"
          cp docs/media/sqlsentinel-demo.mp4 "$RUNNER_TEMP/sqlsentinel-demo.mp4"

      - name: Check out tagged source
        shell: bash
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: git checkout "$TAG"

      - name: Build release package
        run: |
          moon version --all
          moon update
          moon package

      - name: Create or update GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          asset="$(find _build/publish -maxdepth 1 -name '*.zip' -print -quit)"
          if [[ -z "$asset" ]]; then
            echo "::error::Release package was not generated"
            exit 1
          fi

          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "Release $TAG already exists; updating assets."
          else
            gh release create "$TAG" \
              --verify-tag \
              --title "SQLSentinel $TAG" \
              --notes-file "$RUNNER_TEMP/SQLSENTINEL_RELEASE_NOTES.md"
          fi

          gh release upload "$TAG" \
            "$asset" \
            "$RUNNER_TEMP/sqlsentinel-demo.mp4" \
            --clobber

          gh release view "$TAG" --json url,assets \
            --jq '{url: .url, assets: [.assets[].name]}'
